<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Paneli</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/bcryptjs@2.4.3/dist/bcrypt.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">
    <div class="max-w-4xl mx-auto">
        <div class="bg-white rounded-2xl shadow-xl p-8">
            <h1 class="text-3xl font-bold text-gold-600 mb-6">⚙️ Yönetici Paneli</h1>
            <button onclick="window.location.href='index.html'" class="mb-6 text-blue-600 underline">← Geri Dön</button>

            <div class="space-y-6">
                <div class="bg-gray-50 p-6 rounded-xl">
                    <h2 class="text-xl font-bold mb-4">Yeni Kullanıcı Ekle</h2>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <input id="newUser" placeholder="Kullanıcı adı" class="px-4 py-3 border rounded-lg">
                        <input id="newPass" placeholder="Şifre" class="px-4 py-3 border rounded-lg">
                        <button onclick="addUser()" class="bg-green-600 text-white px-6 py-3 rounded-lg font-bold hover:bg-green-700">
                            EKLE
                        </button>
                    </div>
                </div>

                <div id="userList" class="space-y-3">
                    <div class="text-center">Yükleniyor...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function loadUsers() {
            const res = await fetch('users.json');
            const users = await res.json();
            const list = document.getElementById('userList');
            list.innerHTML = users.map(u => `
                <div class="bg-white p-4 rounded-lg shadow flex justify-between items-center">
                    <div>
                        <strong>${u.user}</strong> 
                        <span class="text-sm text-gray-500">(${u.role})</span>
                    </div>
                    <button onclick="deleteUser('${u.user}')" class="text-red-600 font-bold">SİL</button>
                </div>
            `).join('');
        }

        async function addUser() {
            const user = document.getElementById('newUser').value.trim();
            const pass = document.getElementById('newPass').value;
            if (!user || !pass) return alert("Doldur!");

            const hash = await bcrypt.hash(pass, 10);
            const res = await fetch('users.json');
            const users = await res.json();
            users.push({ user, hash, role: "user" });
            
            // GitHub'da çalışıyorsan bu satırı sil (sadece yerel test için)
            alert(`${user} eklendi! Şifre: ${pass}\n(Not: Gerçek sunucuda otomatik kaydedilmez, manuel güncelle)`);
            loadUsers();
        }

        function deleteUser(username) {
            if (confirm(`${username} silinsin mi?`)) {
                alert("Silindi (manuel güncelle)");
                loadUsers();
            }
        }

        loadUsers();
    </script>
</body>
</html>
