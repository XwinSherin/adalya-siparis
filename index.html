<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Adalya - Giriş</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="h-screen w-screen flex items-center justify-center bg-[url('https://images.unsplash.com/photo-1520032525096-7bd04a94b561?q=80&w=1000&auto=format')] bg-cover bg-center">
    
    <div class="absolute inset-0 bg-black/40"></div>

    <div x-data="loginApp()" class="relative z-10 w-full max-w-md p-6">
        <div class="glass rounded-3xl shadow-2xl p-8 border border-white/20">
            
            <div class="flex justify-center mb-8">
                <div class="w-24 h-24 rounded-full bg-white p-1 shadow-lg overflow-hidden">
                    <img src="images/adalyalogo.jpg" onerror="this.src='https://via.placeholder.com/150?text=Adalya'" class="w-full h-full object-cover rounded-full">
                </div>
            </div>

            <div class="text-center mb-8">
                <h1 class="text-2xl font-extrabold text-gray-800">Adalya Company</h1>
                <p class="text-gray-500 text-sm mt-1">Bayi Sipariş Sistemi</p>
            </div>

            <div class="space-y-4">
                <div>
                    <input type="text" x-model="username" placeholder="Kullanıcı Adı" 
                        class="w-full px-5 py-4 rounded-xl bg-gray-50 border-transparent focus:border-blue-500 focus:bg-white focus:ring-0 transition-all font-semibold text-gray-700"
                        @keydown.enter="$refs.passInput.focus()">
                </div>
                
                <div>
                    <input x-ref="passInput" type="password" x-model="password" placeholder="Şifre" 
                        class="w-full px-5 py-4 rounded-xl bg-gray-50 border-transparent focus:border-blue-500 focus:bg-white focus:ring-0 transition-all font-semibold text-gray-700"
                        @keydown.enter="login()">
                </div>

                <button @click="login()" 
                    class="w-full py-4 bg-gradient-to-r from-blue-600 to-indigo-600 text-white rounded-xl font-bold text-lg shadow-lg hover:shadow-xl transform hover:-translate-y-1 transition-all active:scale-95 flex justify-center items-center">
                    <span x-show="!loading">Giriş Yap</span>
                    <span x-show="loading" class="animate-spin h-5 w-5 border-2 border-white border-t-transparent rounded-full"></span>
                </button>

                <p x-show="error" x-transition class="text-red-500 text-center text-sm font-bold mt-2" x-text="errorMsg"></p>
            </div>
        </div>
        
        <div class="mt-6 flex justify-center gap-4">
            <button class="text-white/80 font-semibold text-sm hover:text-white">Türkçe</button>
            <span class="text-white/40">|</span>
            <button class="text-white/80 font-semibold text-sm hover:text-white">العربية</button>
        </div>
    </div>

    <script>
        function loginApp() {
            return {
                username: '',
                password: '',
                loading: false,
                error: false,
                errorMsg: '',
                async login() {
                    this.loading = true;
                    this.error = false;
                    
                    // GitHub'dan kullanıcıları çekme simülasyonu (Gerçek URL'yi buraya koyacağız)
                    // Güvenlik Notu: Bu basit bir ön yüz korumasıdır.
                    try {
                        const response = await fetch('users.json');
                        const users = await response.json();
                        
                        const user = users.find(u => u.user.toLowerCase() === this.username.toLowerCase() && u.pass === this.password);
                        
                        if(user) {
                            sessionStorage.setItem('user', user.user);
                            window.location.href = 'siparis.html';
                        } else {
                            throw new Error('Hatalı kullanıcı adı veya şifre');
                        }
                    } catch (e) {
                        this.error = true;
                        this.errorMsg = 'Giriş başarısız!';
                        // Demo için fallback (Eğer json okuyamazsa test için)
                        if(this.username === 'admin' && this.password === '1234') {
                            window.location.href = 'siparis.html';
                        }
                    } finally {
                        this.loading = false;
                    }
                }
            }
        }
    </script>
</body>
</html>
