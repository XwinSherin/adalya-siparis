<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Adalya Sipariş Paneli</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; padding-bottom: 180px; }
        /* inputlardaki ok işaretlerini kaldır */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body x-data="orderApp()" x-init="initApp()">

    <div class="fixed top-0 left-0 w-full bg-white shadow-md z-50 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-yellow-500 rounded-lg flex items-center justify-center text-white font-bold shadow-sm">
                <img src="images/adalyalogo.jpg" class="w-full h-full object-cover rounded-lg" onerror="this.style.display='none'">
            </div>
            <div>
                <h1 class="font-bold text-gray-800 text-lg leading-tight">Sipariş Paneli</h1>
                <p class="text-xs text-gray-500" x-text="currentUser"></p>
            </div>
        </div>
        
        <div class="flex bg-gray-100 rounded-lg p-1">
            <button @click="lang='tr'" :class="{'bg-white shadow text-blue-600': lang==='tr'}" class="px-2 py-1 text-xs font-bold rounded transition-all">TR</button>
            <button @click="lang='ar'" :class="{'bg-white shadow text-green-600': lang==='ar'}" class="px-2 py-1 text-xs font-bold rounded transition-all">AR</button>
            <button @click="lang='en'" :class="{'bg-white shadow text-purple-600': lang==='en'}" class="px-2 py-1 text-xs font-bold rounded transition-all">EN</button>
        </div>
    </div>

    <div class="mt-20 px-4 mb-4">
        <div class="mb-3">
            <input type="text" x-model="orderNote" placeholder="Sipariş Notu (Opsiyonel)" 
                class="w-full px-4 py-2 rounded-lg bg-white border border-gray-200 text-sm focus:border-blue-500 outline-none">
        </div>

        <div class="relative">
            <i class="fa-solid fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
            <input x-model="search" type="text" placeholder="Ürün ara..." 
                class="w-full pl-10 pr-4 py-3 bg-white rounded-xl shadow-sm focus:ring-2 focus:ring-blue-500 outline-none text-gray-700 border border-gray-100">
        </div>
    </div>

    <div class="px-4 space-y-4">
        <template x-for="product in filteredProducts" :key="product.id">
            <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-200">
                <div class="flex gap-3">
                    <div class="w-20 h-24 shrink-0 bg-gray-50 rounded-lg p-1 border border-gray-100">
                        <img :src="product.img" loading="lazy" class="w-full h-full object-contain" onerror="this.src='https://via.placeholder.com/150'">
                    </div>

                    <div class="flex-1">
                        <h3 class="font-bold text-gray-800 leading-tight" x-text="lang === 'tr' ? product.tr : (lang === 'ar' ? product.ar : product.en)"></h3>
                        <div class="text-xs text-gray-400 mt-1 mb-2 flex items-center gap-2">
                            <span class="bg-blue-50 text-blue-600 px-2 py-0.5 rounded font-semibold">Koli: <span x-text="getRowKoli(product.id)"></span></span>
                            <span class="bg-green-50 text-green-600 px-2 py-0.5 rounded font-semibold">KG: <span x-text="getRowKg(product.id)"></span></span>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-2 mt-2 pt-2 border-t border-dashed border-gray-200">
                    <div class="flex flex-col">
                        <label class="text-[10px] text-gray-500 font-bold text-center mb-1">50 GR</label>
                        <input type="number" x-model="cart[product.id].g50" placeholder="-" inputmode="numeric"
                            class="w-full bg-gray-50 text-center font-bold text-gray-800 py-2 rounded-lg border focus:border-blue-500 outline-none">
                    </div>
                    <div class="flex flex-col">
                        <label class="text-[10px] text-gray-500 font-bold text-center mb-1">250 GR</label>
                        <input type="number" x-model="cart[product.id].g250" placeholder="-" inputmode="numeric"
                            class="w-full bg-gray-50 text-center font-bold text-gray-800 py-2 rounded-lg border focus:border-blue-500 outline-none">
                    </div>
                    <div class="flex flex-col">
                        <label class="text-[10px] text-gray-500 font-bold text-center mb-1">1000 GR</label>
                        <input type="number" x-model="cart[product.id].g1000" placeholder="-" inputmode="numeric"
                            class="w-full bg-gray-50 text-center font-bold text-gray-800 py-2 rounded-lg border focus:border-blue-500 outline-none">
                    </div>
                </div>
            </div>
        </template>
        
        <div x-show="filteredProducts.length === 0" class="text-center py-10 text-gray-400">
            <i class="fa-solid fa-box-open text-4xl mb-2"></i>
            <p>Ürün bulunamadı</p>
        </div>
    </div>

    <div class="fixed bottom-0 left-0 w-full bg-white shadow-[0_-5px_25px_rgba(0,0,0,0.1)] rounded-t-2xl z-40 safe-bottom border-t border-gray-100">
        
        <div class="grid grid-cols-3 gap-1 px-4 py-2 bg-gray-50 border-b border-gray-200 text-center">
            <div>
                <p class="text-[10px] text-gray-500">TOPLAM KOLİ</p>
                <p class="font-bold text-gray-800 text-lg" x-text="grandTotalKoli"></p>
            </div>
            <div>
                <p class="text-[10px] text-gray-500">TOPLAM KG</p>
                <p class="font-bold text-blue-600 text-lg" x-text="grandTotalKg"></p>
            </div>
            <div>
                <p class="text-[10px] text-gray-500">ÜRÜN ÇEŞİDİ</p>
                <p class="font-bold text-gray-800 text-lg" x-text="totalItemsCount"></p>
            </div>
        </div>

        <div class="p-3 flex gap-2">
            <button @click="exportToExcel()" class="flex-1 bg-green-700 text-white py-3 rounded-xl font-bold shadow-lg active:scale-95 transition-transform flex items-center justify-center gap-2">
                <i class="fa-solid fa-file-excel"></i>
                <span class="text-sm">Excel İndir</span>
            </button>
            
            <button @click="sendWhatsapp()" class="flex-[2] bg-green-500 text-white py-3 rounded-xl font-bold shadow-lg active:scale-95 transition-transform flex items-center justify-center gap-2">
                <i class="fa-brands fa-whatsapp text-xl"></i>
                <span>WhatsApp Sipariş</span>
            </button>
        </div>
    </div>

    <script>
        function orderApp() {
            return {
                lang: 'tr',
                products: [],
                search: '',
                cart: {},
                currentUser: '',
                orderNote: '',
                
                async initApp() {
                    this.currentUser = sessionStorage.getItem('user') || 'Misafir';
                    try {
                        // Önbelleği aşmak için timestamp ekledik
                        const res = await fetch('products.json?t=' + new Date().getTime());
                        const data = await res.json();
                        this.products = data.products;
                        
                        // Sepet yapısını oluştur (Tüm gramajlar için)
                        this.products.forEach(p => {
                            this.cart[p.id] = { g50: '', g250: '', g1000: '' };
                        });
                    } catch(e) {
                        console.error('Veri hatası:', e);
                        alert('Ürün listesi yüklenemedi!');
                    }
                },

                // Filtreleme
                get filteredProducts() {
                    if(!this.search) return this.products;
                    const q = this.search.toLowerCase();
                    return this.products.filter(p => 
                        (p.tr && p.tr.toLowerCase().includes(q)) ||
                        (p.en && p.en.toLowerCase().includes(q)) ||
                        (p.ar && p.ar.toLowerCase().includes(q))
                    );
                },

                // Yardımcı Hesaplamalar
                getVal(val) {
                    return parseInt(val) || 0;
                },

                getRowKoli(id) {
                    const item = this.cart[id];
                    if(!item) return 0;
                    return this.getVal(item.g50) + this.getVal(item.g250) + this.getVal(item.g1000);
                },

                getRowKg(id) {
                    // Eski mantık: Koli Sayısı * 6 = KG
                    return this.getRowKoli(id) * 6;
                },

                // Genel Toplamlar
                get grandTotalKoli() {
                    let total = 0;
                    Object.keys(this.cart).forEach(id => {
                        total += this.getRowKoli(id);
                    });
                    return total;
                },

                get grandTotalKg() {
                    return this.grandTotalKoli * 6;
                },

                get totalItemsCount() {
                    let count = 0;
                    Object.keys(this.cart).forEach(id => {
                        if(this.getRowKoli(id) > 0) count++;
                    });
                    return count;
                },

                // WhatsApp Gönderimi
                sendWhatsapp() {
                    if(this.grandTotalKoli === 0) {
                        alert('Sepetiniz boş!');
                        return;
                    }

                    let text = `*SİPARİŞ - ${this.currentUser}*\n`;
                    text += `📅 Tarih: ${new Date().toLocaleDateString('tr-TR')}\n`;
                    if(this.orderNote) text += `📝 Not: ${this.orderNote}\n`;
                    text += `------------------\n`;

                    this.products.forEach(p => {
                        const item = this.cart[p.id];
                        const koli = this.getRowKoli(p.id);
                        
                        if(koli > 0) {
                            // Ürün adı (Seçili dile göre)
                            let pName = this.lang === 'tr' ? p.tr : (this.lang === 'ar' ? p.ar : p.en);
                            text += `\n🔹 *${pName}*\n`;
                            
                            if(this.getVal(item.g50) > 0) text += `   ▫️ 50g: ${item.g50} Koli\n`;
                            if(this.getVal(item.g250) > 0) text += `   ▫️ 250g: ${item.g250} Koli\n`;
                            if(this.getVal(item.g1000) > 0) text += `   ▫️ 1kg: ${item.g1000} Koli\n`;
                        }
                    });

                    text += `\n------------------\n`;
                    text += `📦 *TOPLAM KOLİ: ${this.grandTotalKoli}*\n`;
                    text += `⚖️ *TOPLAM KG: ${this.grandTotalKg}*`;

                    window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
                },

                // Excel İndirme (Eski kodun modernize edilmiş hali)
                exportToExcel() {
                    if(this.grandTotalKoli === 0) {
                        alert('İndirilecek veri yok!');
                        return;
                    }

                    // Excel için veri hazırlama
                    let data = [];
                    
                    // Başlıklar
                    data.push(["Ürün Adı", "50 Gr (Koli)", "250 Gr (Koli)", "1000 Gr (Koli)", "Toplam Koli", "Toplam KG"]);

                    this.products.forEach(p => {
                        const item = this.cart[p.id];
                        const koli = this.getRowKoli(p.id);
                        
                        if(koli > 0) {
                            data.push([
                                p.tr, // Excel'de her zaman Türkçe isim (veya p.en tercihe göre)
                                this.getVal(item.g50) || "",
                                this.getVal(item.g250) || "",
                                this.getVal(item.g1000) || "",
                                koli,
                                koli * 6
                            ]);
                        }
                    });

                    // Alt Toplam Satırı
                    data.push(["", "", "", "", "", ""]); // Boşluk
                    data.push(["GENEL TOPLAM", "", "", "", this.grandTotalKoli, this.grandTotalKg]);

                    // Excel Dosyası Oluşturma (SheetJS kullanarak)
                    const ws = XLSX.utils.aoa_to_sheet(data);
                    const wb = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(wb, ws, "Siparis");

                    // Dosya isimlendirme
                    const dateStr = new Date().toLocaleDateString('tr-TR').replace(/\./g, '-');
                    XLSX.writeFile(wb, `Siparis_${this.currentUser}_${dateStr}.xlsx`);
                }
            }
        }
    </script>
</body>
</html>
