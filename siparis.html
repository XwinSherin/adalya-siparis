<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Adalya Pro Sipariş</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; padding-bottom: 150px; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        [x-cloak] { display: none !important; }
        
        /* PDF Tablo Stili için */
        .hidden-print { display: none; }
    </style>
</head>
<body x-data="app()" x-init="init()" class="text-gray-800">

    <div x-show="notification.show" x-transition.duration.300ms 
         class="fixed top-4 right-4 z-[60] bg-gray-800 text-white px-4 py-3 rounded-lg shadow-xl flex items-center gap-3" x-cloak>
        <i :class="notification.icon"></i>
        <span x-text="notification.message" class="text-sm font-medium"></span>
    </div>

    <div class="fixed top-0 left-0 w-full glass shadow-sm z-40 px-4 py-2 border-b border-gray-200">
        <div class="flex justify-between items-center mb-2">
            <div class="flex items-center gap-3">
                <img src="images/adalyalogo.jpg" class="w-10 h-10 rounded-lg object-cover border border-gray-200" onerror="this.style.display='none'">
                <div>
                    <h1 class="font-extrabold text-lg tracking-tight text-gray-900">ADALYA</h1>
                    <p class="text-[10px] text-gray-500 font-mono" x-text="orderCode"></p>
                </div>
            </div>
            <div class="flex bg-gray-100 p-1 rounded-lg">
                <template x-for="l in ['tr', 'ar', 'en']">
                    <button @click="setLang(l)" 
                        :class="lang === l ? 'bg-white shadow text-blue-600' : 'text-gray-400 hover:text-gray-600'"
                        class="px-2.5 py-1 rounded text-xs font-bold uppercase transition-all" x-text="l"></button>
                </template>
            </div>
        </div>
    </div>

    <div class="mt-20 px-4 max-w-4xl mx-auto">
        
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 mb-4">
            <div class="mb-4">
                <label class="block text-xs font-bold text-gray-500 mb-1 ml-1">SİPARİŞ NOTU</label>
                <input type="text" x-model="orderNote" placeholder="Örn: Acil teslimat..." 
                    class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition-all">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-500 mb-2 ml-1">TESLİMAT ŞEKLİ</label>
                <div class="grid grid-cols-3 gap-2">
                    <button @click="deliveryMethod='road'" :class="deliveryMethod=='road' ? 'bg-blue-600 text-white ring-2 ring-blue-300' : 'bg-gray-50 text-gray-500 hover:bg-gray-100'" class="py-2.5 rounded-xl text-sm font-bold transition-all flex flex-col items-center gap-1">
                        <i class="fa-solid fa-truck"></i> <span x-text="t('road')"></span>
                    </button>
                    <button @click="deliveryMethod='sea'" :class="deliveryMethod=='sea' ? 'bg-blue-600 text-white ring-2 ring-blue-300' : 'bg-gray-50 text-gray-500 hover:bg-gray-100'" class="py-2.5 rounded-xl text-sm font-bold transition-all flex flex-col items-center gap-1">
                        <i class="fa-solid fa-ship"></i> <span x-text="t('sea')"></span>
                    </button>
                    <button @click="deliveryMethod='air'" :class="deliveryMethod=='air' ? 'bg-blue-600 text-white ring-2 ring-blue-300' : 'bg-gray-50 text-gray-500 hover:bg-gray-100'" class="py-2.5 rounded-xl text-sm font-bold transition-all flex flex-col items-center gap-1">
                        <i class="fa-solid fa-plane"></i> <span x-text="t('air')"></span>
                    </button>
                </div>
            </div>
        </div>

        <div class="relative mb-6 group">
            <i class="fa-solid fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-blue-500 transition-colors"></i>
            <input x-model="search" type="text" :placeholder="t('search')" 
                class="w-full pl-11 pr-4 py-3.5 bg-white rounded-2xl shadow-sm border border-gray-100 focus:ring-4 focus:ring-blue-100 focus:border-blue-500 outline-none transition-all text-gray-700">
            <button x-show="search.length > 0" @click="search=''" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-red-500 p-1">
                <i class="fa-solid fa-times"></i>
            </button>
        </div>

        <div class="space-y-4">
            <template x-for="product in filteredProducts" :key="product.id">
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200 hover:shadow-md transition-shadow duration-300">
                    <div class="flex gap-4">
                        <div class="w-20 h-24 bg-gray-50 rounded-xl border border-gray-100 p-1 shrink-0">
                            <img :src="product.img" class="w-full h-full object-contain mix-blend-multiply" loading="lazy" onerror="this.src='https://via.placeholder.com/150?text=No+Img'">
                        </div>
                        
                        <div class="flex-1 min-w-0">
                            <h3 class="font-bold text-gray-800 text-[15px] leading-tight truncate" x-text="getProductName(product)"></h3>
                            <p class="text-xs text-gray-400 truncate" x-text="product.code || 'CODE-00'"></p>
                            
                            <div class="mt-2 flex items-center gap-2 text-xs font-bold">
                                <span class="bg-blue-50 text-blue-600 px-2 py-1 rounded-md" x-show="getRowKoli(product.id) > 0">
                                    <i class="fa-solid fa-box mr-1"></i><span x-text="getRowKoli(product.id)"></span>
                                </span>
                                <span class="bg-green-50 text-green-600 px-2 py-1 rounded-md" x-show="getRowKoli(product.id) > 0">
                                    <i class="fa-solid fa-weight-hanging mr-1"></i><span x-text="getRowKg(product.id)"></span>kg
                                </span>
                            </div>
                        </div>
                    </div>

                    <div class="mt-4 grid grid-cols-3 gap-3">
                        <div class="relative">
                            <label class="block text-[10px] font-extrabold text-gray-400 text-center mb-1">50 GR</label>
                            <input type="number" x-model="cart[product.id].g50" @input="saveLocal()" inputmode="numeric" placeholder="-"
                                class="w-full bg-gray-50 border border-gray-200 rounded-lg py-2 text-center font-bold text-gray-800 focus:border-blue-500 focus:bg-white outline-none transition-colors">
                        </div>
                        <div class="relative">
                            <label class="block text-[10px] font-extrabold text-gray-400 text-center mb-1">250 GR</label>
                            <input type="number" x-model="cart[product.id].g250" @input="saveLocal()" inputmode="numeric" placeholder="-"
                                class="w-full bg-gray-50 border border-gray-200 rounded-lg py-2 text-center font-bold text-gray-800 focus:border-blue-500 focus:bg-white outline-none transition-colors">
                        </div>
                        <div class="relative">
                            <label class="block text-[10px] font-extrabold text-gray-400 text-center mb-1">1 KG</label>
                            <input type="number" x-model="cart[product.id].g1000" @input="saveLocal()" inputmode="numeric" placeholder="-"
                                class="w-full bg-gray-50 border border-gray-200 rounded-lg py-2 text-center font-bold text-gray-800 focus:border-blue-500 focus:bg-white outline-none transition-colors">
                        </div>
                    </div>
                </div>
            </template>
            
            <div x-show="filteredProducts.length === 0" class="text-center py-12" x-cloak>
                <div class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-3 text-gray-400">
                    <i class="fa-solid fa-magnifying-glass text-2xl"></i>
                </div>
                <p class="text-gray-500 font-medium">Ürün bulunamadı.</p>
            </div>
        </div>
    </div>

    <div class="fixed bottom-0 left-0 w-full bg-white border-t border-gray-200 shadow-[0_-10px_40px_rgba(0,0,0,0.1)] z-50 safe-bottom">
        <div class="max-w-4xl mx-auto">
            <div class="grid grid-cols-3 divide-x divide-gray-100 border-b border-gray-100 bg-gray-50/50">
                <div class="p-2 text-center">
                    <p class="text-[10px] font-bold text-gray-400 uppercase">Toplam Koli</p>
                    <p class="text-lg font-black text-gray-800" x-text="grandTotalKoli"></p>
                </div>
                <div class="p-2 text-center">
                    <p class="text-[10px] font-bold text-gray-400 uppercase">Toplam KG</p>
                    <p class="text-lg font-black text-blue-600" x-text="grandTotalKg"></p>
                </div>
                <div class="p-2 text-center">
                    <p class="text-[10px] font-bold text-gray-400 uppercase">Ürünler</p>
                    <p class="text-lg font-black text-gray-800" x-text="totalItemsCount"></p>
                </div>
            </div>
            
            <div class="p-3">
                <button @click="openSummaryModal()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3.5 rounded-xl font-bold text-base shadow-lg shadow-blue-200 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                    <i class="fa-solid fa-list-check"></i>
                    <span x-text="t('viewSummary')"></span>
                </button>
            </div>
        </div>
    </div>

    <div x-show="showModal" class="fixed inset-0 z-[100] flex items-end sm:items-center justify-center p-4 sm:p-6" x-cloak>
        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" @click="showModal=false" x-transition.opacity></div>
        
        <div class="relative bg-white w-full max-w-lg rounded-2xl shadow-2xl flex flex-col max-h-[90vh]" x-transition.scale>
            <div class="p-4 border-b border-gray-100 flex justify-between items-center bg-gray-50 rounded-t-2xl">
                <h2 class="font-bold text-lg text-gray-800" x-text="t('orderSummary')"></h2>
                <button @click="showModal=false" class="w-8 h-8 rounded-full bg-white border border-gray-200 flex items-center justify-center text-gray-500 hover:text-red-500 shadow-sm transition-colors">
                    <i class="fa-solid fa-times"></i>
                </button>
            </div>

            <div class="p-4 overflow-y-auto flex-1">
                <div class="bg-blue-50 rounded-xl p-4 mb-4 text-sm space-y-2 border border-blue-100">
                    <div class="flex justify-between"><span class="text-blue-600 font-semibold">Kullanıcı:</span> <span x-text="currentUser"></span></div>
                    <div class="flex justify-between"><span class="text-blue-600 font-semibold">Kod:</span> <span x-text="orderCode"></span></div>
                    <div class="flex justify-between"><span class="text-blue-600 font-semibold">Tarih:</span> <span x-text="new Date().toLocaleDateString()"></span></div>
                    <div class="flex justify-between"><span class="text-blue-600 font-semibold">Teslimat:</span> <span class="uppercase font-bold" x-text="t(deliveryMethod)"></span></div>
                </div>

                <table class="w-full text-sm text-left mb-4">
                    <thead>
                        <tr class="border-b-2 border-gray-100 text-xs text-gray-500 uppercase">
                            <th class="py-2">Ürün</th>
                            <th class="py-2 text-center">Adet</th>
                            <th class="py-2 text-right">Koli</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-50">
                        <template x-for="p in products" :key="p.id">
                            <tr x-show="getRowKoli(p.id) > 0">
                                <td class="py-2 font-medium text-gray-700" x-text="getProductName(p)"></td>
                                <td class="py-2 text-center text-xs text-gray-500">
                                    <span x-show="getVal(cart[p.id].g50)>0" x-text="getVal(cart[p.id].g50)+'x50g '"></span>
                                    <span x-show="getVal(cart[p.id].g250)>0" x-text="getVal(cart[p.id].g250)+'x250g '"></span>
                                    <span x-show="getVal(cart[p.id].g1000)>0" x-text="getVal(cart[p.id].g1000)+'x1kg'"></span>
                                </td>
                                <td class="py-2 text-right font-bold" x-text="getRowKoli(p.id)"></td>
                            </tr>
                        </template>
                    </tbody>
                    <tfoot class="border-t-2 border-gray-100 bg-gray-50">
                        <tr>
                            <td class="py-3 font-bold">TOPLAM</td>
                            <td></td>
                            <td class="py-3 text-right font-black text-blue-600 text-lg" x-text="grandTotalKoli"></td>
                        </tr>
                    </tfoot>
                </table>
            </div>

            <div class="p-4 border-t border-gray-100 grid grid-cols-1 gap-3 bg-gray-50 rounded-b-2xl">
                <div class="grid grid-cols-2 gap-3">
                    <button @click="exportPDF()" class="bg-red-500 hover:bg-red-600 text-white py-3 rounded-xl font-bold flex items-center justify-center gap-2 shadow-lg shadow-red-200 transition-transform active:scale-95">
                        <i class="fa-solid fa-file-pdf"></i> PDF İndir
                    </button>
                    <button @click="exportExcel()" class="bg-green-700 hover:bg-green-800 text-white py-3 rounded-xl font-bold flex items-center justify-center gap-2 shadow-lg shadow-green-200 transition-transform active:scale-95">
                        <i class="fa-solid fa-file-excel"></i> Excel İndir
                    </button>
                </div>
                <button @click="shareWhatsapp()" class="w-full bg-green-500 hover:bg-green-600 text-white py-3.5 rounded-xl font-bold text-lg flex items-center justify-center gap-2 shadow-lg shadow-green-200 transition-transform active:scale-95">
                    <i class="fa-brands fa-whatsapp text-xl"></i> WhatsApp ile Gönder
                </button>
            </div>
        </div>
    </div>

    <script>
        function app() {
            return {
                lang: 'tr',
                products: [],
                search: '',
                cart: {},
                currentUser: '',
                orderNote: '',
                orderCode: '',
                deliveryMethod: 'road',
                showModal: false,
                notification: { show: false, message: '', icon: '' },

                // Dil Tanımları
                translations: {
                    tr: { road: 'Karayolu', sea: 'Denizyolu', air: 'Havayolu', search: 'Ürün ara...', viewSummary: 'Siparişi Tamamla', orderSummary: 'Sipariş Özeti' },
                    en: { road: 'Road', sea: 'Sea', air: 'Air', search: 'Search product...', viewSummary: 'Complete Order', orderSummary: 'Order Summary' },
                    ar: { road: 'طريق', sea: 'بحر', air: 'هواء', search: 'بحث...', viewSummary: 'أكمل الطلب', orderSummary: 'ملخص الطلب' }
                },

                t(key) {
                    return this.translations[this.lang][key] || key;
                },

                async init() {
                    // Kullanıcı ve Kod Oluşturma
                    this.currentUser = sessionStorage.getItem('user') || 'USER';
                    const now = new Date();
                    const dateStr = now.toLocaleDateString('tr-TR').replace(/\./g, '');
                    const timeStr = now.getHours() + "" + now.getMinutes();
                    this.orderCode = `${this.currentUser}-${dateStr}-${timeStr}`;

                    // Verileri Yükle
                    try {
                        const res = await fetch('products.json?v=' + Date.now());
                        const data = await res.json();
                        this.products = data.products;
                        
                        // Offline Veri Kontrolü (LocalStorage)
                        const savedCart = localStorage.getItem('adalya_cart');
                        if(savedCart) {
                            this.cart = JSON.parse(savedCart);
                            this.showToast('Eski sepetiniz yüklendi', 'fa-solid fa-clock-rotate-left');
                        } else {
                            this.products.forEach(p => this.cart[p.id] = { g50: '', g250: '', g1000: '' });
                        }
                    } catch(e) {
                        alert('Veri hatası!');
                    }
                },

                saveLocal() {
                    // Her tuşa basıldığında kaydet (Offline Mod)
                    localStorage.setItem('adalya_cart', JSON.stringify(this.cart));
                },

                // Hesaplamalar
                getVal(val) { return parseInt(val) || 0; },
                getRowKoli(id) {
                    const i = this.cart[id];
                    return i ? this.getVal(i.g50) + this.getVal(i.g250) + this.getVal(i.g1000) : 0;
                },
                getRowKg(id) { return this.getRowKoli(id) * 6; },
                getProductName(p) { return this.lang === 'tr' ? p.tr : (this.lang === 'ar' ? p.ar : p.en); },

                get filteredProducts() {
                    if(!this.search) return this.products;
                    const q = this.search.toLowerCase();
                    return this.products.filter(p => 
                        (p.tr && p.tr.toLowerCase().includes(q)) ||
                        (p.en && p.en.toLowerCase().includes(q)) ||
                        (p.ar && p.ar.toLowerCase().includes(q)) ||
                        (p.code && p.code.toLowerCase().includes(q))
                    );
                },

                get grandTotalKoli() { return Object.keys(this.cart).reduce((acc, id) => acc + this.getRowKoli(id), 0); },
                get grandTotalKg() { return this.grandTotalKoli * 6; },
                get totalItemsCount() { return Object.keys(this.cart).filter(id => this.getRowKoli(id) > 0).length; },

                openSummaryModal() {
                    if(this.grandTotalKoli === 0) {
                        this.showToast('Sepetiniz boş!', 'fa-solid fa-triangle-exclamation');
                        return;
                    }
                    this.showModal = true;
                },

                // AKSİYONLAR
                exportExcel() {
                    let data = [
                        ["Kullanıcı", this.currentUser, "Kod", this.orderCode],
                        ["Tarih", new Date().toLocaleDateString(), "Teslimat", this.t(this.deliveryMethod)],
                        ["Not", this.orderNote],
                        [],
                        ["Ürün Adı", "50 Gr", "250 Gr", "1000 Gr", "Toplam Koli", "KG"]
                    ];

                    this.products.forEach(p => {
                        if(this.getRowKoli(p.id) > 0) {
                            const i = this.cart[p.id];
                            data.push([
                                p.tr,
                                this.getVal(i.g50) || "",
                                this.getVal(i.g250) || "",
                                this.getVal(i.g1000) || "",
                                this.getRowKoli(p.id),
                                this.getRowKg(p.id)
                            ]);
                        }
                    });
                    data.push(["GENEL TOPLAM", "", "", "", this.grandTotalKoli, this.grandTotalKg]);

                    const ws = XLSX.utils.aoa_to_sheet(data);
                    const wb = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(wb, ws, "Siparis");
                    XLSX.writeFile(wb, `Adalya_${this.orderCode}.xlsx`);
                    this.showToast('Excel indirildi', 'fa-solid fa-check');
                },

                exportPDF() {
                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF();
                    
                    // Başlık
                    doc.setFontSize(18);
                    doc.text("ADALYA COMPANY SIPARIS", 105, 15, { align: "center" });
                    
                    doc.setFontSize(10);
                    doc.text(`Kullanıcı: ${this.currentUser}`, 14, 25);
                    doc.text(`Kod: ${this.orderCode}`, 14, 30);
                    doc.text(`Tarih: ${new Date().toLocaleDateString()}`, 150, 25);
                    doc.text(`Teslimat: ${this.t(this.deliveryMethod).toUpperCase()}`, 150, 30);
                    if(this.orderNote) doc.text(`Not: ${this.orderNote}`, 14, 38);

                    // Tablo Verisi Hazırla
                    let body = [];
                    this.products.forEach(p => {
                        if(this.getRowKoli(p.id) > 0) {
                            const i = this.cart[p.id];
                            body.push([
                                p.tr,
                                this.getVal(i.g50) || '-',
                                this.getVal(i.g250) || '-',
                                this.getVal(i.g1000) || '-',
                                this.getRowKoli(p.id),
                                this.getRowKg(p.id)
                            ]);
                        }
                    });

                    doc.autoTable({
                        head: [['Ürün', '50g', '250g', '1Kg', 'Koli', 'KG']],
                        body: body,
                        startY: 45,
                        theme: 'grid',
                        styles: { fontSize: 8 },
                        headStyles: { fillColor: [41, 128, 185] },
                        foot: [['TOPLAM', '', '', '', this.grandTotalKoli, this.grandTotalKg]]
                    });

                    doc.save(`Adalya_${this.orderCode}.pdf`);
                    this.showToast('PDF oluşturuldu', 'fa-solid fa-check');
                },

                shareWhatsapp() {
                    let text = `*SİPARİŞ - ${this.orderCode}*\n`;
                    text += `👤 ${this.currentUser}\n`;
                    text += `🚛 ${this.t(this.deliveryMethod).toUpperCase()}\n`;
                    if(this.orderNote) text += `📝 ${this.orderNote}\n`;
                    text += `------------------\n`;

                    this.products.forEach(p => {
                        if(this.getRowKoli(p.id) > 0) {
                            const i = this.cart[p.id];
                            text += `\n🔹 *${p.tr}*\n`;
                            if(this.getVal(i.g50)) text += `   ▫️ 50g: ${i.g50}\n`;
                            if(this.getVal(i.g250)) text += `   ▫️ 250g: ${i.g250}\n`;
                            if(this.getVal(i.g1000)) text += `   ▫️ 1kg: ${i.g1000}\n`;
                            text += `   📦 Toplam: ${this.getRowKoli(p.id)} Koli\n`;
                        }
                    });

                    text += `\n------------------\n`;
                    text += `📊 *GENEL TOPLAM: ${this.grandTotalKoli} Koli (${this.grandTotalKg} Kg)*`;

                    window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
                },

                showToast(msg, icon) {
                    this.notification = { show: true, message: msg, icon: icon };
                    setTimeout(() => this.notification.show = false, 3000);
                }
            }
        }
    </script>
</body>
</html>
