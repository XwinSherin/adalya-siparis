<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Adalya Platinum V5</title>
<link rel="icon" href="data:image/x-icon;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: {
                            50: '#fbf8eb', 100: '#f5eccd', 400: '#e2c044', 500: '#d4af37', 600: '#b38b22', 700: '#8f6818', 900: '#4d3608',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f9fafb; padding-bottom: 180px; }
        [x-cloak] { display: none !important; }
        
        /* Tablo Stilleri */
        .summary-table th, .summary-table td { border: 1px solid #e2e8f0; }
        
        /* Scrollbar */
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #d4af37; border-radius: 10px; }
    </style>
</head>
<body x-data="app()" x-init="init()" :dir="lang === 'ar' ? 'rtl' : 'ltr'" class="text-gray-800 selection:bg-gold-200">

    <button @click="window.scrollTo({top: 0, behavior: 'smooth'})" x-show="showScrollBtn" x-transition 
        class="fixed bottom-24 right-4 z-30 bg-gray-800 text-white w-10 h-10 rounded-full shadow-lg flex items-center justify-center opacity-80 hover:opacity-100">
        <i class="fa-solid fa-arrow-up"></i>
    </button>

    <div class="fixed top-0 left-0 w-full bg-white/95 backdrop-blur shadow-md z-40 px-4 py-2 border-b border-gold-100">
        <div class="flex flex-col items-center justify-center relative max-w-3xl mx-auto">
            <img src="images/adalyalogo.jpg" id="logoImg" class="h-12 object-contain mb-1 transition-transform hover:scale-105" onerror="this.style.display='none'">
            
            <div class="absolute top-1/2 -translate-y-1/2 flex bg-gray-100 p-1 rounded-lg border border-gray-200" :class="lang==='ar' ? 'left-0' : 'right-0'">
                <template x-for="l in ['tr', 'ar', 'en']">
                    <button @click="changeLang(l)" 
                        :class="lang === l ? 'bg-gold-500 text-white shadow-sm' : 'text-gray-400 hover:text-gray-600'"
                        class="w-8 h-7 flex items-center justify-center rounded text-xs font-bold uppercase transition-all" x-text="l"></button>
                </template>
            </div>
        </div>
    </div>

    <div class="mt-24 px-4 max-w-3xl mx-auto">
        
        <div class="bg-white p-5 rounded-xl shadow-sm border-t-4 border-gold-500 mb-5 ring-1 ring-gray-100">
            <div class="mb-4">
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1.5" x-text="t('noteLabel')"></label>
                <div class="relative">
                    <i class="fa-solid fa-pen absolute top-1/2 -translate-y-1/2 text-gold-500 text-sm" :class="lang === 'ar' ? 'right-3' : 'left-3'"></i>
                    <input type="text" x-model="orderNote" :placeholder="t('notePlaceholder')" 
                        class="w-full py-3 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-gold-400 focus:bg-white outline-none transition-all"
                        :class="lang === 'ar' ? 'pr-9 pl-4' : 'pl-9 pr-4'">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-2" x-text="t('deliveryLabel')"></label>
                <div class="grid grid-cols-3 gap-3">
                    <template x-for="method in ['road', 'sea', 'air']">
                        <button @click="deliveryMethod=method" 
                            :class="deliveryMethod==method ? 'bg-gold-500 text-white shadow-md shadow-gold-200' : 'bg-white border border-gray-200 text-gray-500 hover:bg-gray-50'"
                            class="py-2.5 rounded-lg text-xs font-bold transition-all flex flex-col items-center gap-1.5">
                            <i :class="getDeliveryIconClass(method)"></i> 
                            <span x-text="t(method)"></span>
                        </button>
                    </template>
                </div>
            </div>
        </div>

        <div class="relative mb-6">
            <i class="fa-solid fa-magnifying-glass absolute top-1/2 -translate-y-1/2 text-gold-500 text-lg" :class="lang === 'ar' ? 'right-4' : 'left-4'"></i>
            <input x-model="search" type="text" :placeholder="t('search')" 
                class="w-full py-4 bg-white rounded-xl shadow-sm border border-gray-200 focus:ring-2 focus:ring-gold-400 outline-none transition-all text-gray-700 font-medium placeholder-gray-400"
                :class="lang === 'ar' ? 'pr-12 pl-4' : 'pl-12 pr-4'">
            <button x-show="search.length > 0" @click="search=''" class="absolute top-1/2 -translate-y-1/2 w-6 h-6 bg-gray-200 rounded-full flex items-center justify-center text-gray-500 hover:bg-red-500 hover:text-white transition-colors" :class="lang === 'ar' ? 'left-4' : 'right-4'">
                <i class="fa-solid fa-times text-xs"></i>
            </button>
        </div>

        <div class="space-y-4">
            <template x-for="product in filteredProducts" :key="product.id">
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden hover:shadow-md transition-shadow">
                    <div class="p-4 flex gap-4">
                        <div class="w-24 h-24 shrink-0 bg-white rounded-lg border border-gray-100 p-1 flex items-center justify-center">
                            <img :src="product.img" class="w-full h-full object-contain" loading="lazy" onerror="this.src='https://via.placeholder.com/150?text=Adalya'">
                        </div>
                        <div class="flex-1 min-w-0 flex flex-col justify-center">
                            <h3 class="font-bold text-gray-800 text-base leading-snug mb-1" x-text="getProductName(product)"></h3>
                            <p class="text-xs text-gray-400" x-text="product.code || ''"></p>
                        </div>
                    </div>

                    <div class="px-4 pb-2">
                        <div class="grid grid-cols-3 gap-3">
                            <div class="space-y-1">
                                <label class="block text-[10px] font-bold text-gray-400 text-center uppercase" x-text="t('g50')"></label>
                                <input type="text" inputmode="numeric" 
                                    :value="formatDisplayInput(cart[product.id].g50)" 
                                    @input="handleInput($event, product.id, 'g50')"
                                    class="w-full bg-gray-50 border border-gray-200 rounded-lg py-2.5 text-center font-bold text-gray-900 text-lg focus:border-gold-500 focus:bg-white outline-none transition-colors tabular-nums">
                            </div>
                            <div class="space-y-1">
                                <label class="block text-[10px] font-bold text-gray-400 text-center uppercase" x-text="t('g250')"></label>
                                <input type="text" inputmode="numeric"
                                    :value="formatDisplayInput(cart[product.id].g250)" 
                                    @input="handleInput($event, product.id, 'g250')"
                                    class="w-full bg-gray-50 border border-gray-200 rounded-lg py-2.5 text-center font-bold text-gray-900 text-lg focus:border-gold-500 focus:bg-white outline-none transition-colors tabular-nums">
                            </div>
                            <div class="space-y-1">
                                <label class="block text-[10px] font-bold text-gray-400 text-center uppercase" x-text="t('g1000')"></label>
                                <input type="text" inputmode="numeric"
                                    :value="formatDisplayInput(cart[product.id].g1000)" 
                                    @input="handleInput($event, product.id, 'g1000')"
                                    class="w-full bg-gray-50 border border-gray-200 rounded-lg py-2.5 text-center font-bold text-gray-900 text-lg focus:border-gold-500 focus:bg-white outline-none transition-colors tabular-nums">
                            </div>
                        </div>
                    </div>

                    <div class="mt-3 bg-gray-50 h-10 px-4 border-t border-gray-100 flex items-center justify-center gap-6">
                        <div class="flex items-center gap-1.5">
                            <span class="text-[10px] font-bold text-gray-400 uppercase" x-text="t('colBox')"></span>
                            <span class="font-bold text-gray-800 text-sm tabular-nums" x-text="formatNum(getRowKoli(product.id))"></span>
                        </div>
                        <div class="w-px h-4 bg-gray-300"></div>
                        <div class="flex items-center gap-1.5">
                            <span class="text-[10px] font-bold text-gray-400 uppercase" x-text="t('colKg')"></span>
                            <span class="font-bold text-gold-600 text-sm tabular-nums" x-text="formatNum(getRowKg(product.id))"></span>
                        </div>
                    </div>
                </div>
            </template>
            <div x-show="filteredProducts.length === 0" class="text-center py-12" x-cloak>
                <p class="text-gray-400 font-medium" x-text="t('noProduct')"></p>
            </div>
        </div>
    </div>

    <div class="fixed bottom-0 left-0 w-full bg-white border-t border-gray-200 shadow-[0_-10px_40px_rgba(0,0,0,0.05)] z-50 pb-safe">
        <div class="max-w-3xl mx-auto">
            <div class="grid grid-cols-3 divide-x divide-gray-100 bg-gold-50/50" :class="lang === 'ar' ? 'divide-x-reverse' : ''">
                <div class="p-2.5 text-center">
                    <p class="text-[10px] font-bold text-gray-400 uppercase" x-text="t('totalBox')"></p>
                    <p class="text-lg font-black text-gray-800 tabular-nums" x-text="formatNum(grandTotalKoli)"></p>
                </div>
                <div class="p-2.5 text-center">
                    <p class="text-[10px] font-bold text-gray-400 uppercase" x-text="t('totalKg')"></p>
                    <p class="text-lg font-black text-gold-600 tabular-nums" x-text="formatNum(grandTotalKg)"></p>
                </div>
                <div class="p-2.5 text-center">
                    <p class="text-[10px] font-bold text-gray-400 uppercase" x-text="t('items')"></p>
                    <p class="text-lg font-black text-gray-800 tabular-nums" x-text="formatNum(totalItemsCount)"></p>
                </div>
            </div>
            <div class="p-3 pb-5">
                <button @click="openSummaryModal()" class="w-full bg-gradient-to-r from-gold-500 to-gold-600 hover:from-gold-600 hover:to-gold-700 text-white py-4 rounded-xl font-bold text-base shadow-lg shadow-gold-200 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                    <i class="fa-solid fa-check-circle"></i>
                    <span x-text="t('viewSummary')"></span>
                </button>
            </div>
        </div>
    </div>

    <div x-show="showModal" class="fixed inset-0 z-[100] flex items-end sm:items-center justify-center p-0 sm:p-4" x-cloak>
        <div class="absolute inset-0 bg-gray-900/60 backdrop-blur-sm transition-opacity" @click="showModal=false"></div>
        
        <div class="relative bg-white w-full sm:max-w-3xl h-[90vh] sm:h-auto sm:rounded-2xl rounded-t-2xl shadow-2xl flex flex-col overflow-hidden">
            
            <div class="px-5 py-4 border-b border-gray-200 flex justify-between items-center bg-gray-50">
                <div class="flex items-center gap-3">
                    <img src="images/adalyalogo.jpg" class="h-8 object-contain" onerror="this.style.display='none'">
                    <div class="h-8 w-px bg-gray-300"></div>
                    <div>
                        <h2 class="font-bold text-base text-gray-800 uppercase tracking-wide" x-text="t('orderSummary')"></h2>
                        <p class="text-[10px] text-gray-500" x-text="orderCode"></p>
                    </div>
                </div>
                <button @click="showModal=false" class="w-8 h-8 rounded-full bg-white border border-gray-200 flex items-center justify-center text-gray-400 hover:text-red-500 transition-colors">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <div class="px-5 py-3 bg-gold-50 border-b border-gold-100" x-show="orderNote">
                <p class="text-xs text-gold-700 font-bold uppercase mb-1" x-text="t('noteLabel')"></p>
                <p class="text-sm text-gray-800 italic" x-text="orderNote"></p>
            </div>

            <div class="flex-1 overflow-y-auto custom-scroll bg-white p-4">
                <table class="w-full text-sm text-left border-collapse summary-table">
                    <thead class="bg-gray-50 text-gray-700 sticky top-0 shadow-sm">
                        <tr>
                            <th class="px-2 py-2 text-xs font-bold uppercase w-1/3" x-text="t('product')"></th>
                            <th class="px-1 py-2 text-center text-[10px] font-bold" x-text="t('g50')"></th>
                            <th class="px-1 py-2 text-center text-[10px] font-bold" x-text="t('g250')"></th>
                            <th class="px-1 py-2 text-center text-[10px] font-bold" x-text="t('g1000')"></th>
                            <th class="px-1 py-2 text-center text-[10px] font-bold bg-gray-100" x-text="t('colBox')"></th>
                            <th class="px-1 py-2 text-center text-[10px] font-bold bg-gray-100" x-text="t('colKg')"></th>
                        </tr>
                    </thead>
                    <tbody>
                        <template x-for="p in products" :key="p.id">
                            <tr x-show="getRowKoli(p.id) > 0" class="hover:bg-gray-50">
                                <td class="px-2 py-2 font-semibold text-gray-800 text-xs" x-text="getProductName(p)"></td>
                                <td class="px-1 py-2 text-center tabular-nums text-xs" x-text="formatNum(getVal(cart[p.id].g50)) || ''"></td>
                                <td class="px-1 py-2 text-center tabular-nums text-xs" x-text="formatNum(getVal(cart[p.id].g250)) || ''"></td>
                                <td class="px-1 py-2 text-center tabular-nums text-xs" x-text="formatNum(getVal(cart[p.id].g1000)) || ''"></td>
                                <td class="px-1 py-2 text-center font-bold bg-gray-50 tabular-nums" x-text="formatNum(getRowKoli(p.id))"></td>
                                <td class="px-1 py-2 text-center font-bold text-gold-600 bg-gray-50 tabular-nums" x-text="formatNum(getRowKg(p.id))"></td>
                            </tr>
                        </template>
                    </tbody>
                    <tfoot class="bg-gray-100 font-bold text-xs border-t-2 border-gold-400">
                        <tr>
                            <td class="px-2 py-2 text-gray-600" x-text="t('total')"></td>
                            <td class="px-1 py-2 text-center tabular-nums" x-text="formatNum(columnSums.g50) || ''"></td>
                            <td class="px-1 py-2 text-center tabular-nums" x-text="formatNum(columnSums.g250) || ''"></td>
                            <td class="px-1 py-2 text-center tabular-nums" x-text="formatNum(columnSums.g1000) || ''"></td>
                            <td class="px-1 py-2 text-center bg-gray-200 tabular-nums" x-text="formatNum(grandTotalKoli)"></td>
                            <td class="px-1 py-2 text-center bg-gray-200 text-gold-700 tabular-nums" x-text="formatNum(grandTotalKg)"></td>
                        </tr>
                    </tfoot>
                </table>
            </div>

            <div class="p-4 border-t border-gray-100 bg-white pb-8 sm:pb-4 shadow-[0_-5px_15px_rgba(0,0,0,0.05)]">
                <div class="grid grid-cols-2 gap-3 mb-3">
                    <button @click="exportPDF()" class="bg-red-50 border border-red-100 text-red-600 hover:bg-red-100 py-3 rounded-xl font-bold flex items-center justify-center gap-2 transition-colors">
                        <i class="fa-solid fa-file-pdf"></i> PDF (3 Lang)
                    </button>
                    <button @click="exportExcel()" class="bg-green-50 border border-green-100 text-green-600 hover:bg-green-100 py-3 rounded-xl font-bold flex items-center justify-center gap-2 transition-colors">
                        <i class="fa-solid fa-file-excel"></i> Excel (3 Lang)
                    </button>
                </div>
                <button @click="shareWhatsapp()" class="w-full bg-green-500 hover:bg-green-600 text-white py-3.5 rounded-xl font-bold text-lg flex items-center justify-center gap-2 shadow-lg shadow-green-200 active:scale-[0.98] transition-all">
                    <i class="fa-brands fa-whatsapp text-xl"></i> <span x-text="t('sendWhatsapp')"></span>
                </button>
            </div>
        </div>
    </div>

    <script>
        function app() {
            return {
                lang: 'tr',
                products: [],
                search: '',
                cart: {},
                currentUser: '',
                orderNote: '',
                orderCode: '',
                deliveryMethod: 'road',
                showModal: false,
                showScrollBtn: false,
                logoBase64: '',

                translations: {
                    tr: { 
                        noteLabel: 'Sipariş Notu', notePlaceholder: 'Notunuzu buraya yazın...', deliveryLabel: 'Teslimat Şekli',
                        road: 'Karayolu', sea: 'Denizyolu', air: 'Havayolu', search: 'Ürün ara...', noProduct: 'Ürün bulunamadı.',
                        totalBox: 'Toplam Koli', totalKg: 'Toplam KG', items: 'Çeşit', viewSummary: 'Siparişi Onayla',
                        orderSummary: 'Sipariş Detayı', product: 'Ürün', total: 'TOPLAM', grandTotal: 'GENEL TOPLAM',
                        sendWhatsapp: 'WhatsApp Sipariş', g50: '50 GR', g250: '250 GR', g1000: '1 KG', colBox: 'KOLİ', colKg: 'KG'
                    },
                    en: { 
                        noteLabel: 'Order Note', notePlaceholder: 'Type your note...', deliveryLabel: 'Delivery Method',
                        road: 'Road', sea: 'Sea', air: 'Air', search: 'Search product...', noProduct: 'No product found.',
                        totalBox: 'Total Box', totalKg: 'Total KG', items: 'Items', viewSummary: 'Confirm Order',
                        orderSummary: 'Order Detail', product: 'Product', total: 'TOTAL', grandTotal: 'GRAND TOTAL',
                        sendWhatsapp: 'Order via WhatsApp', g50: '50 GR', g250: '250 GR', g1000: '1 KG', colBox: 'BOX', colKg: 'KG'
                    },
                    ar: { 
                        noteLabel: 'ملاحظة الطلب', notePlaceholder: 'اكتب ملاحظتك هنا...', deliveryLabel: 'طريقة التسليم',
                        road: 'براً', sea: 'بحراً', air: 'جواً', search: 'بحث عن منتج...', noProduct: 'لم يتم العثور على منتج.',
                        totalBox: 'مجموع الصناديق', totalKg: 'مجموع الوزن', items: 'الأصناف', viewSummary: 'تأكيد الطلب',
                        orderSummary: 'تفاصيل الطلب', product: 'المنتج', total: 'المجموع', grandTotal: 'الإجمالي الكلي',
                        sendWhatsapp: 'طلب عبر واتساب', g50: '٥٠ غرام', g250: '٢٥٠ غرام', g1000: '١ كجم', colBox: 'كولي', colKg: 'كجم'
                    }
                },

                t(key) { return this.translations[this.lang][key] || key; },
                t_lang(key, l) { return this.translations[l][key] || key; },
                
                changeLang(l) { this.lang = l; },

                getDeliveryIconClass(method) {
                    const icons = { road: 'fa-truck', sea: 'fa-ship', air: 'fa-plane' };
                    return `fa-solid ${icons[method]} text-lg mb-1`;
                },

                async init() {
                    this.currentUser = sessionStorage.getItem('user') || 'USER';
                    const today = new Date();
                    const rnd = Math.floor(1000 + Math.random() * 9000);
                    this.orderCode = `${today.getDate()}${today.getMonth()+1}-${rnd}`;

                    // Logo'yu Base64'e çevir (PDF için)
                    this.logoBase64 = await this.imageToBase64('images/adalyalogo.jpg');

                    window.addEventListener('scroll', () => {
                        this.showScrollBtn = window.scrollY > 200;
                    });

                    try {
                        const res = await fetch('products.json?v=' + Date.now());
                        const data = await res.json();
                        this.products = data.products;
                        const savedCart = localStorage.getItem('adalya_cart_v5');
                        if(savedCart) this.cart = JSON.parse(savedCart);
                        else this.products.forEach(p => this.cart[p.id] = { g50: '', g250: '', g1000: '' });
                    } catch(e) { console.error(e); }
                },

                imageToBase64(url) {
                    return new Promise((resolve, reject) => {
                        const img = new Image();
                        img.crossOrigin = 'Anonymous';
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            canvas.width = img.width;
                            canvas.height = img.height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0);
                            resolve(canvas.toDataURL('image/jpeg'));
                        };
                        img.onerror = reject;
                        img.src = url;
                    });
                },

                saveLocal() {
                    localStorage.setItem('adalya_cart_v5', JSON.stringify(this.cart));
                },

                // MANTIK VE FORMATLAMA
                handleInput(e, productId, gramType) {
                    let val = e.target.value;
                    val = val.replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)); 
                    val = val.replace(/[^0-9]/g, ''); 
                    if (val.length > 6) val = val.slice(0, 6);
                    this.cart[productId][gramType] = val;
                    this.saveLocal();
                    e.target.value = this.formatDisplayInput(val);
                },

                formatDisplayInput(val) {
                    if (!val) return '';
                    let formatted = val.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
                    if (this.lang === 'ar') return formatted.replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);
                    return formatted;
                },

                formatNum(val) {
                    if (!val && val !== 0) return '0';
                    let formatted = parseInt(val).toLocaleString('tr-TR');
                    if (this.lang === 'ar') return formatted.replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);
                    return formatted;
                },

                getVal(val) { return !val ? 0 : parseInt(val.toString().replace(/[^0-9]/g, '')); },
                getRowKoli(id) { const i = this.cart[id]; return i ? this.getVal(i.g50) + this.getVal(i.g250) + this.getVal(i.g1000) : 0; },
                getRowKg(id) { return this.getRowKoli(id) * 6; },
                getProductName(p, l = this.lang) { return l === 'tr' ? p.tr : (l === 'ar' ? p.ar : p.en); },

                // <<< EKLENEN/DÜZELTİLEN KOD BAŞLANGICI >>>
                get filteredProducts() {
                    if (this.search.length < 2) {
                        // Arama terimi yoksa veya çok kısaysa, tüm ürünleri göster
                        return this.products; 
                    }
                    
                    const searchTerm = this.search.toLowerCase();
                    
                    return this.products.filter(p => {
                        // Ürün adı veya kodu üzerinden arama yap
                        // İlgili dil ismini kontrol et (TR, EN, AR)
                        const trName = (p.tr || '').toLowerCase();
                        const enName = (p.en || '').toLowerCase();
                        const arName = (p.ar || '').toLowerCase();
                        const code = (p.code || '').toLowerCase();
                        
                        return trName.includes(searchTerm) 
                            || enName.includes(searchTerm)
                            || arName.includes(searchTerm)
                            || code.includes(searchTerm);
                    });
                },
                // <<< EKLENEN/DÜZELTİLEN KOD BİTİŞİ >>>

                get grandTotalKoli() { return Object.keys(this.cart).reduce((acc, id) => acc + this.getRowKoli(id), 0); },
                get grandTotalKg() { return this.grandTotalKoli * 6; },
                get totalItemsCount() { return Object.keys(this.cart).filter(id => this.getRowKoli(id) > 0).length; },

                get columnSums() {
                    let sums = { g50: 0, g250: 0, g1000: 0 };
                    Object.keys(this.cart).forEach(id => {
                        if(this.getRowKoli(id) > 0) {
                            sums.g50 += this.getVal(this.cart[id].g50);
                            sums.g250 += this.getVal(this.cart[id].g250);
                            sums.g1000 += this.getVal(this.cart[id].g1000);
                        }
                    });
                    return sums;
                },

                openSummaryModal() {
                    if(this.grandTotalKoli === 0) return;
                    this.showModal = true;
                },

                // --- HELPER: KARAKTER DÜZELTME ---
                fixChar(str) {
                    if(!str) return "";
                    const map = {'ğ':'g','Ğ':'G','ü':'u','Ü':'U','ş':'s','Ş':'S','ı':'i','İ':'I','ö':'o','Ö':'O','ç':'c','Ç':'C'};
                    return str.replace(/[ğĞüÜşŞıİöÖçÇ]/g, m => map[m]);
                },

                // --- EXCEL (3 SAYFA) ---
                exportExcel() {
                    const wb = XLSX.utils.book_new();
                    
                    ['tr', 'en', 'ar'].forEach(l => {
                        let data = [
                            ["ADALYA COMPANY"],
                            [this.t_lang('orderSummary', l)],
                            ["User", this.currentUser, "Date", new Date().toLocaleDateString()],
                            ["Method", this.t_lang(this.deliveryMethod, l), "Note", this.orderNote || '-'],
                            [],
                            [
                                this.t_lang('product', l), 
                                this.t_lang('g50', l), 
                                this.t_lang('g250', l), 
                                this.t_lang('g1000', l), 
                                this.t_lang('colBox', l), 
                                this.t_lang('colKg', l)
                            ]
                        ];

                        this.products.forEach(p => {
                            if(this.getRowKoli(p.id) > 0) {
                                const i = this.cart[p.id];
                                data.push([
                                    this.getProductName(p, l),
                                    this.getVal(i.g50) || "",
                                    this.getVal(i.g250) || "",
                                    this.getVal(i.g1000) || "",
                                    this.getRowKoli(p.id),
                                    this.getRowKg(p.id)
                                ]);
                            }
                        });
                        data.push(["TOTAL", 
                            this.columnSums.g50 || "", this.columnSums.g250 || "", this.columnSums.g1000 || "", 
                            this.grandTotalKoli, this.grandTotalKg
                        ]);

                        const ws = XLSX.utils.aoa_to_sheet(data);
                        XLSX.utils.book_append_sheet(wb, ws, l.toUpperCase());
                    });

                    XLSX.writeFile(wb, `Adalya_Multilang_${this.orderCode}.xlsx`);
                },

                // --- PDF (3 SAYFA, ORTALI LOGO, 0 GİZLİ) ---
                exportPDF() {
                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF();
                    const langs = ['tr', 'en', 'ar'];

                    langs.forEach((l, index) => {
                        if (index > 0) doc.addPage();

                        // Logo Ortalı
                        if(this.logoBase64) {
                            doc.addImage(this.logoBase64, 'JPEG', 85, 10, 40, 0); // x=85 (ortala), y=10
                        }

                        doc.setFontSize(16);
                        doc.text("ADALYA COMPANY", 105, 40, { align: "center" });
                        
                        doc.setFontSize(10);
                        doc.text(`${this.fixChar(this.t_lang('orderSummary', l))}`, 105, 46, { align: "center" });

                        // Bilgiler
                        let startY = 55;
                        doc.text(`User: ${this.fixChar(this.currentUser)}`, 14, startY);
                        doc.text(`Date: ${new Date().toLocaleDateString()}`, 150, startY);
                        doc.text(`Method: ${this.fixChar(this.t_lang(this.deliveryMethod, l))}`, 14, startY+6);
                        if(this.orderNote) doc.text(`Note: ${this.fixChar(this.orderNote)}`, 14, startY+12);

                        // Tablo Verisi
                        let body = [];
                        this.products.forEach(p => {
                            if(this.getRowKoli(p.id) > 0) {
                                const i = this.cart[p.id];
                                body.push([
                                    this.fixChar(this.getProductName(p, l)),
                                    this.getVal(i.g50) || '',
                                    this.getVal(i.g250) || '',
                                    this.getVal(i.g1000) || '',
                                    this.getRowKoli(p.id),
                                    this.getRowKg(p.id)
                                ]);
                            }
                        });

                        doc.autoTable({
                            head: [[
                                this.fixChar(this.t_lang('product', l)),
                                this.t_lang('g50', l),
                                this.t_lang('g250', l),
                                this.t_lang('g1000', l),
                                this.fixChar(this.t_lang('colBox', l)),
                                this.fixChar(this.t_lang('colKg', l))
                            ]],
                            body: body,
                            startY: startY + 20,
                            theme: 'grid',
                            headStyles: { fillColor: [212, 175, 55] }, // Gold Renk
                            foot: [[
                                'TOTAL',
                                this.columnSums.g50 || '',
                                this.columnSums.g250 || '',
                                this.columnSums.g1000 || '',
                                this.grandTotalKoli,
                                this.grandTotalKg
                            ]]
                        });
                    });

                    doc.save(`Adalya_${this.orderCode}.pdf`);
                },

                // --- WHATSAPP (ARAPÇA İSE ÇİFT DİL) ---
                shareWhatsapp() {
                    let text = "";
                    
                    // Mesaj Oluşturucu Fonksiyon
                    const buildMsg = (l) => {
                        let t = `*ADALYA - ${this.orderCode} (${l.toUpperCase()})*\n`;
                        t += `👤 ${this.currentUser}\n`;
                        t += `🚛 ${this.t_lang(this.deliveryMethod, l)}\n`;
                        if(this.orderNote) t += `📝 ${this.orderNote}\n`;
                        t += `------------------\n`;
                        
                        this.products.forEach(p => {
                            const koli = this.getRowKoli(p.id);
                            if(koli > 0) {
                                const i = this.cart[p.id];
                                t += `\n🔹 *${this.getProductName(p, l)}*`;
                                t += ` (${koli} ${this.t_lang('colBox', l)} / ${this.getRowKg(p.id)} ${this.t_lang('colKg', l)})`;
                                if(this.getVal(i.g50)) t += `\n   ▫️ 50g: ${this.formatNum(i.g50)}`;
                                if(this.getVal(i.g250)) t += `\n   ▫️ 250g: ${this.formatNum(i.g250)}`;
                                if(this.getVal(i.g1000)) t += `\n   ▫️ 1kg: ${this.formatNum(i.g1000)}`;
                            }
                        });
                        t += `\n------------------\n📊 TOTAL: ${this.grandTotalKoli} ${this.t_lang('colBox', l)}\n`;
                        return t;
                    };

                    if(this.lang === 'ar') {
                        // Arapça + Türkçe
                        text += buildMsg('ar');
                        text += "\n\n⬇️ TURKISH / TÜRKÇE ⬇️\n\n";
                        text += buildMsg('tr');
                    } else {
                        // Sadece seçili dil
                        text += buildMsg(this.lang);
                    }

                    window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
                }
            }
        }
    </script>
</body>
