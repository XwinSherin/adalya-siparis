<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Adalya Sipariş</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; padding-bottom: 100px; background: #F3F4F6; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body x-data="orderApp()" x-init="initApp()">

    <div class="fixed top-0 left-0 w-full bg-white shadow-sm z-50 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <img src="images/adalyalogo.jpg" class="w-10 h-10 rounded-lg border border-gray-200">
            <div>
                <h1 class="font-bold text-gray-800 leading-tight">Sipariş Oluştur</h1>
                <p class="text-xs text-gray-500" x-text="today"></p>
            </div>
        </div>
        <div class="bg-blue-50 text-blue-600 px-3 py-1 rounded-full text-xs font-bold">
            <span x-text="currentUser"></span>
        </div>
    </div>

    <div class="mt-20 px-4 mb-4">
        <div class="relative">
            <i class="fa-solid fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
            <input x-model="search" type="text" placeholder="Ürün ara..." 
                class="w-full pl-10 pr-4 py-3 bg-white border-none rounded-2xl shadow-sm focus:ring-2 focus:ring-blue-500 outline-none text-gray-700">
        </div>
    </div>

    <div class="px-4 mb-6 flex gap-3 overflow-x-auto hide-scrollbar pb-2">
        <button class="bg-blue-600 text-white px-5 py-2 rounded-full text-sm font-bold whitespace-nowrap shadow-lg shadow-blue-200">Tümü</button>
        <button class="bg-white text-gray-600 px-5 py-2 rounded-full text-sm font-bold whitespace-nowrap border">Blue Horse</button>
        <button class="bg-white text-gray-600 px-5 py-2 rounded-full text-sm font-bold whitespace-nowrap border">Klasik</button>
    </div>

    <div class="px-4 space-y-4">
        <template x-for="product in filteredProducts" :key="product.id">
            <div class="bg-white p-3 rounded-2xl shadow-sm border border-gray-100 flex gap-4">
                <div class="w-24 h-24 shrink-0 bg-gray-100 rounded-xl overflow-hidden relative">
                    <img :src="product.img" loading="lazy" class="w-full h-full object-cover">
                </div>

                <div class="flex-1 flex flex-col justify-between py-1">
                    <div>
                        <h3 class="font-bold text-gray-800 text-sm" x-text="product.tr"></h3>
                        <p class="text-xs text-gray-400 mt-0.5" x-text="product.ar"></p>
                    </div>

                    <div class="flex items-center justify-between mt-2">
                        <div class="flex flex-col items-center gap-1 w-1/3">
                            <span class="text-[10px] font-bold text-gray-400">50g</span>
                            <input type="number" x-model="cart[product.id].g50" placeholder="-" 
                                class="w-full bg-gray-50 text-center font-bold text-gray-800 py-1 rounded-lg border focus:border-blue-500 outline-none text-sm">
                        </div>
                        <div class="flex flex-col items-center gap-1 w-1/3 mx-2">
                            <span class="text-[10px] font-bold text-gray-400">1Kg</span>
                            <input type="number" x-model="cart[product.id].g1000" placeholder="-"
                                class="w-full bg-gray-50 text-center font-bold text-gray-800 py-1 rounded-lg border focus:border-blue-500 outline-none text-sm">
                        </div>
                    </div>
                </div>
            </div>
        </template>
    </div>

    <div class="fixed bottom-0 left-0 w-full bg-white shadow-[0_-5px_20px_rgba(0,0,0,0.05)] rounded-t-3xl z-40 safe-bottom">
        <div class="p-5">
            <div class="flex justify-between items-end mb-4">
                <div>
                    <p class="text-xs text-gray-500 font-semibold">TOPLAM KOLİ</p>
                    <h2 class="text-2xl font-black text-gray-800" x-text="totalKoli"></h2>
                </div>
                <div class="text-right">
                    <p class="text-xs text-gray-500 font-semibold">TOPLAM KG</p>
                    <h2 class="text-xl font-bold text-blue-600"><span x-text="totalKg"></span> kg</h2>
                </div>
            </div>
            
            <button @click="sendOrder()" 
                class="w-full bg-green-500 hover:bg-green-600 text-white py-4 rounded-xl font-bold text-lg shadow-lg shadow-green-200 flex items-center justify-center gap-2 transition-all active:scale-95">
                <i class="fa-brands fa-whatsapp text-2xl"></i>
                <span>WhatsApp ile Gönder</span>
            </button>
        </div>
    </div>

    <script>
        function orderApp() {
            return {
                products: [],
                search: '',
                cart: {},
                currentUser: '',
                today: new Date().toLocaleDateString('tr-TR'),
                
                async initApp() {
                    this.currentUser = sessionStorage.getItem('user') || 'Misafir';
                    // Ürünleri Çek
                    try {
                        const res = await fetch('products.json');
                        const data = await res.json();
                        this.products = data.products;
                        // Sepet yapısını hazırla
                        this.products.forEach(p => {
                            this.cart[p.id] = { g50: '', g250: '', g1000: '' };
                        });
                    } catch(e) {
                        console.error('Ürünler yüklenemedi');
                    }
                },

                get filteredProducts() {
                    if(!this.search) return this.products;
                    return this.products.filter(p => 
                        p.tr.toLowerCase().includes(this.search.toLowerCase()) ||
                        p.en.toLowerCase().includes(this.search.toLowerCase())
                    );
                },

                get totalKoli() {
                    let total = 0;
                    Object.values(this.cart).forEach(item => {
                        total += (Number(item.g50) || 0) + (Number(item.g1000) || 0);
                    });
                    return total;
                },

                get totalKg() {
                    // Basit hesaplama: 1 koli = 6kg varsayımı (Eski kodundan alındı)
                    return this.totalKoli * 6; 
                },

                sendOrder() {
                    let message = `*SİPARİŞ - ${this.currentUser}*\n📅 Tarih: ${this.today}\n------------------\n`;
                    let hasItem = false;

                    this.products.forEach(p => {
                        const item = this.cart[p.id];
                        if(item.g50 > 0 || item.g1000 > 0) {
                            hasItem = true;
                            message += `\n*${p.tr}*`;
                            if(item.g50 > 0) message += `\n📦 50g: ${item.g50} Koli`;
                            if(item.g1000 > 0) message += `\n📦 1Kg: ${item.g1000} Koli`;
                        }
                    });

                    message += `\n------------------\n📊 *TOPLAM: ${this.totalKoli} Koli (${this.totalKg} Kg)*`;

                    if(!hasItem) {
                        alert('Lütfen en az bir ürün seçin!');
                        return;
                    }

                    window.open(`https://wa.me/?text=${encodeURIComponent(message)}`, '_blank');
                }
            }
        }
    </script>
</body>
</html>
